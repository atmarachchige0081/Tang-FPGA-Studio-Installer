name: Sync, build, attest, and release Windows installer

on:
  repository_dispatch:
    types: [studio_release]
  workflow_dispatch:
    inputs:
      mode:
        description: Synchronize upstream or build an already-synchronized tag
        type: choice
        options: [sync, build]
        default: sync
      tag:
        description: Studio tag such as v1.2.0; blank syncs the latest release
        type: string
        required: false
  schedule:
    - cron: "17 * * * *"
  push:
    tags:
      - "v*"

permissions:
  actions: write
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: installer-release-${{ github.event.client_payload.tag || inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  sync-upstream:
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'repository_dispatch' ||
      (github.event_name == 'workflow_dispatch' && inputs.mode != 'build')
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out installer automation
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Resolve and validate Studio release
        id: release
        shell: pwsh
        env:
          DISPATCH_TAG: ${{ github.event.client_payload.tag }}
          MANUAL_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = if ($env:DISPATCH_TAG) { $env:DISPATCH_TAG } elseif ($env:MANUAL_TAG) { $env:MANUAL_TAG } else { '' }
          if (-not $tag) {
            $headers = @{ Accept = 'application/vnd.github+json'; 'User-Agent' = 'TangPrimer-Installer-Sync' }
            $latest = Invoke-RestMethod -Headers $headers `
              -Uri 'https://api.github.com/repos/atmarachchige0081/Tang-Primer-20K-FPGA-Studio/releases/latest'
            $tag = $latest.tag_name
          }
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') { throw "Invalid Studio release tag: $tag" }

          $headers = @{ Accept = 'application/vnd.github+json'; 'User-Agent' = 'TangPrimer-Installer-Sync' }
          $encodedTag = [Uri]::EscapeDataString($tag)
          $upstream = Invoke-RestMethod -Headers $headers `
            -Uri "https://api.github.com/repos/atmarachchige0081/Tang-Primer-20K-FPGA-Studio/releases/tags/$encodedTag"

          & gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          $published = $LASTEXITCODE -eq 0
          $remoteTag = & git ls-remote --tags origin "refs/tags/$tag"

          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$($tag.Substring(1))" >> $env:GITHUB_OUTPUT
          "published=$($published.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "tag_exists=$([bool]$remoteTag)" >> $env:GITHUB_OUTPUT
          "upstream_url=$($upstream.html_url)" >> $env:GITHUB_OUTPUT

      - name: Fetch released Studio source
        if: steps.release.outputs.published != 'true' && steps.release.outputs.tag_exists != 'True'
        shell: pwsh
        run: |
          $source = Join-Path $env:RUNNER_TEMP 'studio-upstream'
          git clone --quiet --depth 1 --branch '${{ steps.release.outputs.tag }}' `
            https://github.com/atmarachchige0081/Tang-Primer-20K-FPGA-Studio.git $source
          if ($LASTEXITCODE -ne 0) { throw 'Unable to fetch the released Studio source.' }

      - name: Synchronize approved application and workspace files
        if: steps.release.outputs.published != 'true' && steps.release.outputs.tag_exists != 'True'
        shell: pwsh
        run: .\sync-upstream.ps1 -SourceRoot (Join-Path $env:RUNNER_TEMP 'studio-upstream') -Version '${{ steps.release.outputs.version }}'

      - name: Generate installer release notes
        if: steps.release.outputs.published != 'true' && steps.release.outputs.tag_exists != 'True'
        shell: pwsh
        run: |
          $headers = @{ Accept = 'application/vnd.github+json'; 'User-Agent' = 'TangPrimer-Installer-Sync' }
          $tag = '${{ steps.release.outputs.tag }}'
          $encodedTag = [Uri]::EscapeDataString($tag)
          $upstream = Invoke-RestMethod -Headers $headers `
            -Uri "https://api.github.com/repos/atmarachchige0081/Tang-Primer-20K-FPGA-Studio/releases/tags/$encodedTag"
          $notes = @"
          # Tang Primer FPGA Studio Installer $tag

          This one-file Windows installer was generated automatically from the verified
          [$tag Studio release]($($upstream.html_url)). It includes the IDE, learning projects,
          first-launch release notes, netlist viewer, and the dependency setup workflow.

          Download ``TangPrimerFPGAStudio-Setup-$($tag.Substring(1)).exe`` and verify the adjacent
          SHA-256 file or GitHub build-provenance attestation before installation.

          ## Studio release notes

          $($upstream.body)
          "@
          [IO.File]::WriteAllText('RELEASE_NOTES.md', $notes.Trim() + "`n", [Text.UTF8Encoding]::new($false))

          $changelog = [IO.File]::ReadAllText('CHANGELOG.md')
          if ($changelog -notmatch [Regex]::Escape("## $tag")) {
            $entry = "## $tag — automatically synchronized`n`n- Packaged and tested the $tag Studio release from its immutable Git tag.`n- Updated the bundled IDE, examples, documentation, and screenshots.`n- Published a checksum and signed GitHub build-provenance attestation.`n"
            $changelog = $changelog -replace '^# Changelog\s*', "# Changelog`n`n$entry`n"
            [IO.File]::WriteAllText('CHANGELOG.md', $changelog, [Text.UTF8Encoding]::new($false))
          }

      - name: Commit synchronized sources and create installer tag
        if: steps.release.outputs.published != 'true' && steps.release.outputs.tag_exists != 'True'
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Sync Studio ${{ steps.release.outputs.tag }}"
            git push origin HEAD:main
          }
          git tag -a '${{ steps.release.outputs.tag }}' -m 'Installer for Studio ${{ steps.release.outputs.tag }}'
          git push origin '${{ steps.release.outputs.tag }}'

      - name: Queue build from the immutable installer tag
        if: steps.release.outputs.published != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run release.yml --repo $env:GITHUB_REPOSITORY `
            --ref '${{ steps.release.outputs.tag }}' `
            -f mode=build -f tag='${{ steps.release.outputs.tag }}'

      - name: Report already published release
        if: steps.release.outputs.published == 'true'
        shell: pwsh
        run: Write-Host 'Installer ${{ steps.release.outputs.tag }} is already published; no work is needed.'

  windows-installer:
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.mode == 'build')
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out synchronized installer tag
        uses: actions/checkout@v7

      - name: Resolve package version
        id: package
        shell: pwsh
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          $tag = if ($env:INPUT_TAG) { $env:INPUT_TAG } else { $env:GITHUB_REF_NAME }
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') { throw "Invalid installer tag: $tag" }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$($tag.Substring(1))" >> $env:GITHUB_OUTPUT
          "asset=TangPrimerFPGAStudio-Setup-$($tag.Substring(1)).exe" >> $env:GITHUB_OUTPUT

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build installer and checksum
        shell: pwsh
        run: .\build-installer.ps1 -Version '${{ steps.package.outputs.version }}' -SkipInnoInstall

      - name: Test packaged dark and light UI
        shell: pwsh
        run: .\test-installer.ps1 -Version '${{ steps.package.outputs.version }}'

      - name: Generate signed build provenance
        uses: actions/attest@v4
        with:
          subject-path: dist/${{ steps.package.outputs.asset }}

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v6
        with:
          name: TangPrimerFPGAStudio-Setup-${{ steps.package.outputs.version }}
          if-no-files-found: error
          path: |
            dist/${{ steps.package.outputs.asset }}
            dist/${{ steps.package.outputs.asset }}.sha256

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create '${{ steps.package.outputs.tag }}' `
            --verify-tag `
            --latest `
            --title 'Tang Primer FPGA Studio Installer ${{ steps.package.outputs.tag }}' `
            --notes-file RELEASE_NOTES.md `
            'dist/${{ steps.package.outputs.asset }}' `
            'dist/${{ steps.package.outputs.asset }}.sha256'
